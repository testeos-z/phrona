[package]
name = "phrona-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/phrona-mcp"
description = "Model Context Protocol server exposing the phrona library to AI agents"
repository.workspace = true
homepage = "https://github.com/alvaro-co/phrona"
keywords = ["mcp", "ai", "agents", "search"]
categories = ["web-programming"]
readme = "README.md"

[dependencies]
phrona = { workspace = true }
rmcp = { version = "3.1.4", features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio = { workspace = true }
tokio-util = "0.7"
axum = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
schemars = "1"
anyhow = "1"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
