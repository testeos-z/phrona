[package]
name = "phrona"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "High-performance metasearch engine library for Rust and Python"
repository.workspace = true
homepage = "https://github.com/alvaro-co/phrona"
keywords = ["metasearch", "search-engine", "web-scraping", "serp", "aggregator"]
categories = ["web-programming", "network-programming"]
readme = "README.md"

[features]
test-support = []

[dependencies]
wreq = { workspace = true }
wreq-util = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
scraper = { workspace = true }
url = { workspace = true }
percent-encoding = { workspace = true }
psl = { workspace = true }
regex = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
rand = { workspace = true }
base64 = "0.23"
sha2 = { workspace = true }
async-trait = "0.1"
tungstenite = { workspace = true }
zip = { workspace = true }

[lib]
name = "phrona"
path = "src/lib.rs"
