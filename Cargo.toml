[workspace]
resolver = "2"
members = [
    "crates/phrona",
    "crates/phrona-api",
    "crates/phrona-mcp",
    "crates/phrona-python",
    "crates/phrona-cli",
    "examples/rust",
]
default-members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/alvaro-co/phrona"
rust-version = "1.85"

[workspace.dependencies]
phrona = { path = "crates/phrona", version = "0.2.0" }
wreq = { version = "6.0.0-rc.31", features = ["cookies", "gzip", "brotli", "zstd", "deflate", "charset", "stream"] }
wreq-util = { version = "3.0.0-rc.14", features = ["emulation"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
scraper = "0.26"
url = "2"
percent-encoding = "2"
psl = "2.1.226"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
rand = "0.10"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# PyO3's extension-module feature suppresses libpython linking and breaks Cargo's
# test harness. setuptools-rust >= 1.12 handles extension-module linking itself.
pyo3 = { version = "0.29" }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[profile.dev]
opt-level = 0
debug = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2
